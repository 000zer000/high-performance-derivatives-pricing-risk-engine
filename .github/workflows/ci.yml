name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}-${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Debug, Release]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Select Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pybind11
        run: python3 -m pip install --disable-pip-version-check pybind11==3.0.4

      - name: Install OpenMP on macOS
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Show toolchain
        run: |
          cmake --version
          c++ --version
          python3 --version
          python3 -m pybind11 --cmakedir

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_TESTING=ON \
            -DDPR_WARNINGS_AS_ERRORS=ON \
            -DDPR_ENABLE_OPENMP=ON \
            -DDPR_BUILD_PYTHON=ON \
            -DDPR_BUILD_BENCHMARKS=ON \
            -Dpybind11_DIR="$(python3 -m pybind11 --cmakedir)"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: ubuntu-sanitizers
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DDPR_WARNINGS_AS_ERRORS=ON \
            -DDPR_ENABLE_OPENMP=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
